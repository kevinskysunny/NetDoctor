name: NetworkConsoleLite

options:
  bundleIdPrefix: com.networkconsole
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 6
    ENABLE_HARDENED_RUNTIME: YES
    INFOPLIST_FILE: Config/Info.plist
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 1.2
    SWIFT_VERSION: 5.0

targets:
  NetworkCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/NetworkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.networkconsole.lite.core
        PRODUCT_NAME: NetworkCore
    dependencies:
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreWLAN.framework

  NetworkConsoleApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/NetworkConsoleApp
        excludes:
          - Resources
      - path: Sources/NetworkConsoleApp/Resources
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/NetworkConsoleLite.entitlements
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.networkconsole.lite
        PRODUCT_NAME: NetDoctor
    dependencies:
      - target: NetworkCore
