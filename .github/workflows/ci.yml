name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: L10n completeness check
        run: python3 Scripts/check_l10n_completeness.py